<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Task Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body style="background: linear-gradient(to right, #667eea, #764ba2); min-height: 100vh;"></body>

<nav class="navbar navbar-dark bg-dark shadow">

    <div class="container-fluid">

        <span class="navbar-brand mb-0 h1">
            Smart Task Management System
        </span>

    </div>

</nav>

<div class="container mt-5">

    <div class="card border-0 rounded-4 shadow-lg"
style="background: rgba(255,255,255,0.95);">

        <div class="card-body p-4">

            <h2 class="text-center text-primary mb-4">
                Task Dashboard
            </h2>

            <form action="/add" method="POST">

                <div class="row g-3">

                    <div class="col-md-4">
                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="Enter Task"
                            required
                        >
                    </div>

                    <div class="col-md-3">
                        <select name="priority" class="form-select">
                            <option>High</option>
                            <option>Medium</option>
                            <option>Low</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <input
                            type="date"
                            name="due_date"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-2 d-grid">
                        <button class="btn btn-primary">
                            Add Task
                        </button>
                    </div>

                </div>

            </form>

        </div>

    </div>

    <div class="mt-5">

        {% for task in tasks %}

        <div class="card mb-3 shadow-sm border-0 rounded-4">

            <div class="card-body d-flex justify-content-between align-items-center flex-wrap">

                <div>

                    <h5>{{ task.title }}</h5>

                    <p class="mb-1 text-muted">
                        Due Date: {{ task.due_date }}
                    </p>

                    <span class="badge bg-danger">
                        {{ task.priority }} Priority
                    </span>

                    <span class="badge bg-success">
                        {{ task.status }}
                    </span>

                </div>

                <div>

                    <a href="/update/{{ task.id }}" class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="/delete/{{ task.id }}" class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

<footer class="text-center mt-5 mb-3 text-muted">
    Developed using Flask + SQLite + Bootstrap
</footer>

</body>
</html>
